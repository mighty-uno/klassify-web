<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; }
  .wrap {
    position: relative; width: 1080px; height: 1080px;
    background: #0d0e1a; color: #ffffff; display: flex; flex-direction: column;
    padding: 90px 84px 84px;
  }
  .honey-top { position: absolute; top: 0; left: 0; right: 0; height: 12px; background: #ffc93c; }
  .glow {
    position: absolute; top: -160px; left: 50%; transform: translateX(-50%);
    width: 820px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(74,58,255,0.5) 0%, rgba(74,58,255,0) 70%);
  }
  .glow-honey {
    position: absolute; right: -160px; bottom: 60px;
    width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,201,60,0.22) 0%, rgba(255,201,60,0) 70%);
  }
  .header {
    position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .icon { width: 54px; height: 54px; }
  .brand .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .brand .tag { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a8fa3; }
  .handle { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #c7cbe0; }
  .handle strong { color: #ffc93c; }
  .content { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; margin-top: 90px; }
  h1 {
    font-size: 82px; font-weight: 800; letter-spacing: -2px; line-height: 1.05;
  }
  h1 .accent { color: #ffc93c; }
  .card {
    margin-top: 56px; background: #ffffff; color: #14162b;
    border-radius: 20px; padding: 34px 40px;
    display: flex; align-items: center; gap: 26px;
  }
  .card .num { font-size: 46px; font-weight: 800; color: #4a3aff; letter-spacing: -1px; }
  .card .txt { font-size: 27px; font-weight: 600; line-height: 1.3; }
  .card .txt span { display: block; font-size: 19px; font-weight: 400; color: #5e6377; margin-top: 4px; }
  .cta-row {
    margin-top: auto; display: flex; align-items: center; gap: 24px;
  }
  .btn { background: #ffc93c; color: #0d0e1a; font-size: 24px; font-weight: 800; padding: 20px 40px; border-radius: 14px; }
  .btn-ghost { color: #c7cbe0; font-size: 21px; font-weight: 600; }
  .btn-ghost strong { color: #ffffff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="honey-top"></div>
    <div class="glow"></div>
    <div class="glow-honey"></div>
    <div class="header">
      <div class="brand">
        <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="92" height="92" rx="24" fill="#0d0e1a" stroke="#ffffff22" stroke-width="2"/>
          <path fill="none" stroke="#ffc93c" stroke-linecap="round" stroke-linejoin="round" stroke-width="11" d="M33 22v56m0-28 36-26M33 50l36 26"/>
          <circle cx="67" cy="22" r="9" fill="#ffc93c"/>
        </svg>
        <div>
          <div class="wordmark">SkooBee</div>
          <div class="tag">School ERP in your pocket</div>
        </div>
      </div>
      <div class="handle"><strong>@skoobee</strong></div>
    </div>
    <div class="content">
      <h1>Teachers didn&apos;t sign up to be<br /><span class="accent">data-entry clerks.</span></h1>
      <div class="card">
        <span class="num">3s</span>
        <div class="txt">Voice roll call
          <span>Saves ~30 min per teacher, every single day</span>
        </div>
      </div>
      <div class="cta-row">
        <a class="btn" href="https://skoobee.in">Book a demo</a>
        <span class="btn-ghost">skoobee.in →</span>
      </div>
    </div>
  </div>
</body>
</html>
